<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="수학경시대회 기출문제와 오답노트를 한곳에서 관리하는 PWA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>수학경시 오답노트</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">MATH CONTEST</div>
      <h1>수학경시 오답노트</h1>
    </div>
    <button id="installBtn" class="ghost hidden">앱 설치</button>
  </header>

  <main>
    <section id="homeView" class="view active">
      <div class="hero">
        <div>
          <span class="pill">오늘의 학습</span>
          <h2>틀린 문제를<br><b>내 것으로 만들어요.</b></h2>
          <p>기출문제를 풀고 틀린 문제는 자동으로 오답노트에 저장하세요.</p>
        </div>
        <div class="hero-icon">∑</div>
      </div>
      <div class="stats">
        <div class="stat"><strong id="totalSolved">0</strong><span>푼 문제</span></div>
        <div class="stat"><strong id="accuracy">0%</strong><span>정답률</span></div>
        <div class="stat"><strong id="wrongCount">0</strong><span>오답</span></div>
      </div>
      <div class="section-head"><h3>학습 시작</h3></div>
      <div class="cards">
        <button class="action-card" data-go="quiz"><span>📝</span><div><b>기출문제 풀기</b><small>문제를 풀고 정답을 확인해요.</small></div><i>›</i></button>
        <button class="action-card" data-go="wrong"><span>📕</span><div><b>오답노트</b><small>틀린 문제를 다시 풀어보세요.</small></div><i>›</i></button>
        <button class="action-card" data-go="admin"><span>⚙️</span><div><b>관리자 · 문제 추가</b><small>휴대폰에서 기출문제를 직접 등록해요.</small></div><i>›</i></button>
      </div>
      <div class="section-head"><h3>학습 현황</h3></div>
      <div class="progress-box">
        <div class="progress-row"><span>전체 문제 진행률</span><b id="progressText">0 / 0</b></div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
    </section>

    <section id="quizView" class="view">
      <div class="page-head"><button class="back" data-go="home">‹</button><div><span id="quizModeLabel">기출문제</span><h2 id="quizTitle">문제 풀이</h2></div></div>
      <div id="quizArea"></div>
    </section>

    <section id="wrongView" class="view">
      <div class="page-head"><button class="back" data-go="home">‹</button><div><span>REVIEW</span><h2>오답노트</h2></div></div>
      <div id="wrongArea"></div>
    </section>

    <section id="statsView" class="view">
      <div class="page-head"><button class="back" data-go="home">‹</button><div><span>MY RECORD</span><h2>학습 통계</h2></div></div>
      <div id="statsArea"></div>
    </section>

    <section id="adminView" class="view">
      <div class="page-head"><button class="back" data-go="home">‹</button><div><span>ADMIN</span><h2>문제 관리</h2></div></div>
      <div class="admin-tabs">
        <button class="admin-tab active" data-admin-tab="add">문제 추가</button>
        <button class="admin-tab" data-admin-tab="manage">문제 관리</button>
      </div>
      <div id="adminAddArea"></div>
      <div id="adminManageArea" class="hidden"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav active" data-go="home"><span>⌂</span>홈</button>
    <button class="nav" data-go="quiz"><span>✎</span>문제</button>
    <button class="nav" data-go="wrong"><span>▣</span>오답</button>
    <button class="nav" data-go="stats"><span>◔</span>통계</button>
  </nav>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
